<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin — RSP SMART CLINIC</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eaf7f0,#fffdf5);font-family:Arial,sans-serif;color:#173a2c}.card{width:min(430px,92vw);background:#fff;padding:30px;border-radius:20px;box-shadow:0 20px 60px #063d2a18;border:1px solid #dce8e2}.brand{text-align:center;font-weight:800;color:#07513d;font-size:23px}.brand small{display:block;font-size:12px;color:#70817a;margin-top:5px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd9d3;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#078f45;color:#fff;font-weight:800;font:inherit;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#b42318;font-size:13px}.note{font-size:12px;color:#70817a;text-align:center;margin-top:18px;line-height:1.5}</style></head><body><main class="card"><div class="brand">RSP SMART CLINIC<small>Panel Admin</small></div><h2>Masuk</h2><form id="f"><label>Username<input id="u" autocomplete="username" required></label><label>Password<input id="p" type="password" autocomplete="current-password" required></label><button>Login Admin</button></form><div id="m" class="msg"></div><div id="h" style="font-size:12px;color:#70817a;text-align:center;margin-top:8px"></div><div class="note">Akses ini khusus petugas/admin. Jangan bagikan password.</div></main><script>async function checkHealth(){const h=document.getElementById('h');try{const r=await fetch('/api/health',{cache:'no-store'});const x=await r.json();h.textContent='Server terhubung • BUILD '+(x.build||'?')}catch(e){h.textContent='Server belum terhubung'}} checkHealth(); document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');if(location.protocol==='file:'){m.textContent='Login tidak dapat terhubung jika halaman dibuka langsung dari file. Jalankan JALANKAN_BUILD_70.bat terlebih dahulu.';return}m.textContent='Memproses...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Login gagal');location.href='/admin/index.html'}catch(err){if(err instanceof TypeError || /fetch/i.test(err.message||'')){m.textContent='Server tidak terhubung. Jalankan JALANKAN_BUILD_70.bat lalu buka alamat yang dibuka otomatis oleh aplikasi.'}else{m.textContent=err.message}}};</script></body></html>
